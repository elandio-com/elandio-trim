name = "elandio-trim"
main = "src/worker/index.ts"
compatibility_date = "2024-04-05"

# Also expose the worker on <name>.<subdomain>.workers.dev, so a deployment is
# reachable before a custom domain is attached.
workers_dev = true

# Assets config for serving the frontend
#
# run_worker_first is required, not cosmetic. Without it Cloudflare serves any
# matching static file directly and the Worker never runs, so none of the
# security headers in middleware/securityHeaders.ts were ever applied to an HTML
# page — CSP existed only on API responses, where it does nothing.
[assets]
directory = "./src/pages"
binding = "ASSETS"
run_worker_first = true

# D1 Database Binding
#
# database_id is intentionally left as a placeholder. The "Deploy to Cloudflare"
# button reads this file, provisions the D1 database automatically, and rewrites
# this id with the real one — so a placeholder is what that flow expects. Do not
# commit a real database id here, or the button will point deployers at a
# database that is not theirs.
#
# Deploying with the Wrangler CLI instead? Run `wrangler d1 create elandio-trim-db`
# and paste the id it prints here before `wrangler deploy`.
[[d1_databases]]
binding = "DB"
database_name = "elandio-trim-db"
database_id = "xx-REPLACE-WITH-YOUR-DB-ID-xx"

[vars]
ENVIRONMENT = "production"
# ADMIN_TOKEN is intentionally NOT set here: values in this file are committed to
# git and shown in plain text. Set it as an encrypted secret instead, either with
# `wrangler secret put ADMIN_TOKEN` or in the Cloudflare dashboard under
# Settings -> Variables. Locally, put it in .dev.vars (gitignored).
